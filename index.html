<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Processor App</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 500px;
        }

        h2 { margin-top: 0; color: var(--primary); }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .filters {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            background: #e2e8f0;
            color: var(--text);
            font-size: 0.8rem;
        }

        .filter-btn.active {
            background: var(--primary);
            color: white;
        }

        ul { list-style: none; padding: 0; }

        li {
            background: #f1f5f9;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .timestamp { font-size: 0.7rem; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <h2>Data Processor</h2>
    
    <!-- Input Section -->
    <div class="input-group">
        <input type="text" id="dataInput" placeholder="Enter text to process...">
        <button id="addBtn">Process & Add</button>
    </div>

    <!-- Filtering Layer UI -->
    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="long">Long (>5 chars)</button>
        <button class="filter-btn" data-filter="short">Short</button>
    </div>

    <ul id="dataList"></ul>
</div>

<script>
    /**
     * 1. UTILITY / PARSING LAYER
     * Pure functions for data transformation
     */
    const DataUtils = {
        parseInput: (str) => str.trim().toUpperCase(),
        formatTimestamp: () => new Date().toLocaleTimeString(),
        generateId: () => Math.random().toString(36).substr(2, 9)
    };

    /**
     * 2. SERVICE / FILTERING LAYER
     * Logic for categorizing or filtering data
     */
    const DataService = {
        filterData: (list, criteria) => {
            if (criteria === 'long') return list.filter(item => item.text.length > 5);
            if (criteria === 'short') return list.filter(item => item.text.length <= 5);
            return list;
        }
    };

    /**
     * 3. CONTROLLER LAYER
     * Managing the state and UI interactions
     */
    const AppController = {
        state: [],
        currentFilter: 'all',

        init() {
            document.getElementById('addBtn').addEventListener('click', () => this.handleAdd());
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => this.handleFilter(e));
            });
        },

        handleAdd() {
            const input = document.getElementById('dataInput');
            if (!input.value) return;

            // Using the Parsing Utility
            const newItem = {
                id: DataUtils.generateId(),
                text: DataUtils.parseInput(input.value),
                time: DataUtils.formatTimestamp()
            };

            this.state.push(newItem);
            input.value = '';
            this.render();
        },

        handleFilter(e) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            this.currentFilter = e.target.dataset.filter;
            this.render();
        },

        render() {
            const listElement = document.getElementById('dataList');
            
            // Using the Service Layer to filter data before showing it
            const displayData = DataService.filterData(this.state, this.currentFilter);

            listElement.innerHTML = displayData.map(item => `
                <li>
                    <span>${item.text}</span>
                    <span class="timestamp">${item.time}</span>
                </li>
            `).join('');
        }
    };

    // Initialize the application
    AppController.init();
</script>

</body>
</html>
